version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lsf_database
    environment:
      MYSQL_DATABASE: lsf_database
      MYSQL_USER: lsf_user
      MYSQL_PASSWORD: root1234!
      MYSQL_ROOT_PASSWORD: root1234!
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initialize DB with the provided SQL file
      - ./Database/DB.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  signbridge:
    build:
      context: ./signbridge
      dockerfile: Dockerfile
    container_name: signbridge_django
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=lsf_database
      - DB_USER=lsf_user
      - DB_PASSWORD=root1234!
      - DB_PORT=3306
      - ALLOWED_HOSTS=*
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./signbridge:/app

  microservice:
    build:
      context: ./microservice-sign2text
      dockerfile: Dockerfile
    container_name: signbridge_microservice
    ports:
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./microservice-sign2text:/app

volumes:
  db_data:
